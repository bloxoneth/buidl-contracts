[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.24"
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read-write", path = "./"}]

[fmt]
line_length = 100

[rpc_endpoints]
local = "${LOCAL_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }

[rpc_endpoints.base]
url = "https://mainnet.base.org"
